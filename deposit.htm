<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>PrimePay - Deposit</title>
<script src="https://js.paystack.co/v2/inline.js"></script>
<style>
*{box-sizing:border-box}
body{margin:0;background:#07111f;color:white;font-family:Arial;padding:22px}
.container{max-width:430px;margin:35px auto;background:#101e30;padding:25px;border-radius:18px}
h2{color:#d4af37}
p{color:#b9c6d5;line-height:1.6}
label{display:block;margin:18px 0 8px}
input{width:100%;padding:15px;border:1px solid #34465d;border-radius:9px;background:#07111f;color:white;font-size:16px}
button{width:100%;padding:15px;background:#d4af37;color:#07111f;border:0;border-radius:9px;font-weight:bold;font-size:16px;margin-top:20px}
button:disabled{opacity:.5}
#message{overflow-wrap:anywhere;margin-top:15px}
</style>
</head>
<body>
<div class="container">
<h2>PrimePay</h2>
<h3>Deposit Money</h3>
<p>Enter the amount you want to deposit into your PrimePay wallet.</p>

<label>Email Address</label>
<input id="email" type="email" placeholder="Enter your email address">

<label>Amount (GHS)</label>
<input id="amount" type="number" min="1" step="0.01" placeholder="Enter amount">

<button id="payBtn" onclick="payWithPaystack()">Continue to Payment</button>

<p id="message"></p>
</div>

<script>
const PAYSTACK_PUBLIC_KEY="pk_test_1f7f682b967be25e4f5503dc8bb585c9ff91667e";

function payWithPaystack(){
const email=document.getElementById("email").value.trim();
const amountGHS=Number(document.getElementById("amount").value);
const button=document.getElementById("payBtn");
const message=document.getElementById("message");

message.textContent="";

if(!email || !email.includes("@")){
message.textContent="Please enter a valid email address.";
return;
}

if(!Number.isFinite(amountGHS) || amountGHS<=0){
message.textContent="Please enter a valid amount.";
return;
}

button.disabled=true;
button.textContent="Opening secure payment...";

const popup=new PaystackPop();

popup.newTransaction({
key:PAYSTACK_PUBLIC_KEY,
email:email,
amount:Math.round(amountGHS*100),
currency:"GHS",
channels:["mobile_money","card"],

onSuccess:(transaction)=>{
message.textContent="Payment successful! Reference: "+transaction.reference;
button.disabled=false;
button.textContent="Continue to Payment";
},

onCancel:()=>{
message.textContent="Payment was cancelled.";
button.disabled=false;
button.textContent="Continue to Payment";
},

onError:(error)=>{
message.textContent="Payment error: "+error.message;
button.disabled=false;
button.textContent="Continue to Payment";
}
});
}
</script>
</body>
</html>
