
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PrimePay | Create Account</title>
<style>
*{box-sizing:border-box}
body{
 margin:0;
 font-family:Arial,sans-serif;
 background:#07111f;
 color:white;
 min-height:100vh;
 display:flex;
 justify-content:center;
 align-items:center;
 padding:20px;
}
.container{
 width:100%;
 max-width:420px;
 background:#101e30;
 padding:30px 24px;
 border-radius:18px;
 border:1px solid #26384c;
}
.logo{
 text-align:center;
 color:#38e58b;
 font-size:32px;
 font-weight:bold;
 margin-bottom:12px;
}
h2{text-align:center;margin-bottom:8px}
.sub{
 text-align:center;
 color:#a8b6c8;
 font-size:14px;
 margin-bottom:28px;
}
label{
 display:block;
 margin:15px 0 7px;
 font-size:14px;
}
input{
 width:100%;
 padding:14px;
 border-radius:9px;
 border:1px solid #34485e;
 background:#071525;
 color:white;
 font-size:15px;
 outline:none;
}
input:focus{border-color:#38e58b}
button{
 width:100%;
 padding:15px;
 margin-top:24px;
 border:0;
 border-radius:9px;
 background:#38e58b;
 color:#07111f;
 font-size:16px;
 font-weight:bold;
}
.login{
 text-align:center;
 color:#a8b6c8;
 font-size:14px;
 margin-top:22px;
}
.login a{color:#38e58b;text-decoration:none}
.note{
 color:#8395a9;
 font-size:11px;
 text-align:center;
 margin-top:20px;
}
</style>
</head>
<body>
<div class="container">
 <div class="logo">PrimePay</div>
 <h2>Create your account</h2>
 <p class="sub">Create an account to get started with PrimePay.</p>

 <form id="signupForm">
  <label>Full name</label>
  <input type="text" placeholder="Enter your full name" required>

  <label>Email address</label>
  <input type="email" placeholder="Enter your email" required>

  <label>Phone number</label>
  <input type="tel" placeholder="Enter your phone number" required>

  <label>Password</label>
  <input type="password" placeholder="Create a password" minlength="8" required>

  <label>Confirm password</label>
  <input type="password" placeholder="Confirm your password" minlength="8" required>

  <button type="submit">Create Account</button>
 </form>

 <p class="login">Already have an account? <a href="#">Login</a></p>
 <p class="note">By continuing, you agree to PrimePay's Terms and Privacy Policy.</p>
</div>

<script>
document.getElementById("signupForm").addEventListener("submit",function(e){
 e.preventDefault();
 alert("The registration service is not connected yet. Your account has not been created.");
});
</script>
</body>
</html>
