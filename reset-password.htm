
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>PrimePay - Reset Password</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
*{box-sizing:border-box}
body{margin:0;background:#07111f;color:white;font-family:Arial,sans-serif;min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px}
.container{width:100%;max-width:420px;background:#101e30;padding:28px 22px;border-radius:18px;border:1px solid #26384c}
.logo{text-align:center;color:#38e58b;font-size:32px;font-weight:bold}
h2{text-align:center}
.sub{text-align:center;color:#a8b6c8;font-size:14px;line-height:1.5}
label{display:block;margin:18px 0 7px;font-size:14px}
input{width:100%;padding:14px;border-radius:9px;border:1px solid #34485e;background:#071525;color:white;font-size:15px}
button{width:100%;padding:15px;margin-top:23px;border:0;border-radius:9px;background:#38e58b;color:#07111f;font-size:16px;font-weight:bold}
button:disabled{opacity:.6}
#message{text-align:center;font-size:14px;line-height:1.5;margin-top:18px}
a{color:#38e58b}
</style>
</head>
<body>
<div class="container">
<div class="logo">PrimePay</div>
<h2>Create a new password</h2>
<p class="sub">Enter your new password below.</p>
<form id="resetForm">
<label>New password</label>
<input id="password" type="password" minlength="8" required placeholder="At least 8 characters">
<label>Confirm new password</label>
<input id="confirmPassword" type="password" minlength="8" required placeholder="Enter password again">
<button id="submit" type="submit">Update Password</button>
</form>
<p id="message"></p>
<p style="text-align:center"><a href="login.htm">Back to Login</a></p>
</div>
<script>
const SUPABASE_URL="https://dvwcgdlbovmekrnkkqbf.supabase.co";
const SUPABASE_KEY="sb_publishable_CoX-AT53uO_TS1JFSc0YOA_JSIFhV3Y";
const client=window.supabase.createClient(SUPABASE_URL,SUPABASE_KEY);

const form=document.getElementById("resetForm");
const message=document.getElementById("message");
const button=document.getElementById("submit");
let recoveryReady=false;

client.auth.onAuthStateChange((event,session)=>{
if(event==="PASSWORD_RECOVERY" && session){
recoveryReady=true;
message.textContent="Enter your new password.";
}
});

(async()=>{
const {data:{session}}=await client.auth.getSession();
if(session) recoveryReady=true;
if(!session){
message.textContent="Open this page using the password reset link sent to your email.";
}
})();

form.addEventListener("submit",async(e)=>{
e.preventDefault();
message.textContent="";
const password=document.getElementById("password").value;
const confirmPassword=document.getElementById("confirmPassword").value;

if(password.length<8){
message.textContent="Password must contain at least 8 characters.";
return;
}
if(password!==confirmPassword){
message.textContent="The passwords do not match.";
return;
}
if(!recoveryReady){
message.textContent="Please open the password reset link from your email first.";
return;
}

button.disabled=true;
button.textContent="Updating...";

try{
const {error}=await client.auth.updateUser({password});
if(error) throw error;
message.textContent="Password updated successfully! You can now log in.";
form.reset();
await client.auth.signOut();
}catch(error){
message.textContent=error.message||"Could not update password.";
}finally{
button.disabled=false;
button.textContent="Update Password";
}
});
</script>
</body>
</html>
