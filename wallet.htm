
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>PrimePay - Wallet</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
*{box-sizing:border-box}
body{margin:0;background:#07111f;color:white;font-family:Arial,sans-serif;padding-bottom:90px}
header{padding:22px 18px;background:#101e30;display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid #26384c}
.logo{font-size:27px;font-weight:bold;color:#d4af37}
header a{color:#d4af37;text-decoration:none;font-size:14px}
main{max-width:700px;margin:auto;padding:25px 16px}
.eyebrow{color:#d4af37;font-size:12px;font-weight:bold;letter-spacing:2px}
h1{margin:8px 0 20px}
.balance-card{background:linear-gradient(135deg,#d4af37,#9b7515);color:#07111f;border-radius:20px;padding:25px;margin-bottom:25px}
.balance-card small{font-weight:bold}
.balance{font-size:38px;font-weight:bold;margin-top:10px}
.card{background:#101e30;border:1px solid #26384c;border-radius:16px;padding:18px;margin-bottom:15px}
.card h3{margin-top:0}
.transaction{display:flex;justify-content:space-between;gap:15px;padding:15px 0;border-bottom:1px solid #26384c}
.transaction:last-child{border-bottom:0}
.transaction-title{font-weight:bold;margin-bottom:5px}
.muted{color:#a8b6c8;font-size:13px}
.amount{color:#d4af37;font-weight:bold;white-space:nowrap}
.deposit{display:block;background:#ff8c00;color:white;text-align:center;padding:16px;border-radius:12px;font-weight:bold;text-decoration:none;margin:25px 0}
.message{color:#a8b6c8;padding:15px 0}
nav{position:fixed;bottom:0;left:0;right:0;background:#101e30;border-top:1px solid #26384c;display:flex;justify-content:space-around;padding:13px 5px}
nav a{color:#a8b6c8;text-decoration:none;text-align:center;font-size:12px}
nav a:nth-child(3){color:#d4af37}
nav span{display:block;font-size:20px;margin-bottom:4px}
</style>
</head>
<body>
<header><div class="logo">PrimePay</div><a href="store.htm">Store</a></header>
<main>
<div class="eyebrow">MY WALLET</div>
<h1>Your Wallet</h1>
<div class="balance-card"><small>AVAILABLE BALANCE</small><div class="balance" id="balance">GH₵ 0.00</div></div>
<a href="deposit.htm" class="deposit">+ Deposit Money</a>
<div class="card"><h3>Recent Transactions</h3><div id="transactions"><p class="message">Loading transactions...</p></div></div>
</main>
<nav>
<a href="store.htm"><span>▣</span>Store</a>
<a href="#"><span>♧</span>Redeemed</a>
<a href="wallet.htm"><span>◉</span>Wallet</a>
<a href="#"><span>↻</span>History</a>
</nav>
<script>
const SUPABASE_URL="https://dvwcgdlbovmekrnkkqbf.supabase.co";
const SUPABASE_KEY="sb_publishable_CoX-AT53uO_TS1JFSc0YOA_JSIFhV3Y";
const client=window.supabase.createClient(SUPABASE_URL,SUPABASE_KEY);
async function loadWallet(){
const balanceElement=document.getElementById("balance");
const transactionsElement=document.getElementById("transactions");
try{
const {data:{user},error:userError}=await client.auth.getUser();
if(userError || !user){
balanceElement.textContent="Please log in";
transactionsElement.innerHTML="<p class='message'>Please log in to view your wallet.</p>";
return;
}
const {data:wallet,error:walletError}=await client.from("wallets").select("balance").eq("user_id",user.id).maybeSingle();
if(walletError) throw walletError;
balanceElement.textContent="GH₵ "+Number(wallet?.balance || 0).toFixed(2);
const {data:transactions,error:transactionError}=await client.from("wallet_transactions").select("transaction_type,amount,description,created_at").eq("user_id",user.id).order("created_at",{ascending:false}).limit(20);
if(transactionError) throw transactionError;
transactionsElement.innerHTML="";
if(!transactions || transactions.length===0){
transactionsElement.innerHTML="<p class='message'>No transactions yet.</p>";
return;
}
transactions.forEach(transaction=>{
const row=document.createElement("div");
row.className="transaction";
const left=document.createElement("div");
const title=document.createElement("div");
title.className="transaction-title";
title.textContent=transaction.transaction_type==="deposit"?"Deposit Approved":"Withdrawal";
const description=document.createElement("div");
description.className="muted";
description.textContent=transaction.description || new Date(transaction.created_at).toLocaleString();
left.append(title,description);
const amount=document.createElement("div");
amount.className="amount";
amount.textContent=(transaction.transaction_type==="deposit"?"+":"-")+"GH₵ "+Number(transaction.amount).toFixed(2);
row.append(left,amount);
transactionsElement.appendChild(row);
});
}catch(error){
balanceElement.textContent="Error";
transactionsElement.innerHTML="<p class='message'>"+error.message+"</p>";
}
}
loadWallet();
</script>
</body>
</html>
